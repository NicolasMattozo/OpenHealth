spring.application.name=sistema-prontuarios

# Banco de dados (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/prontuarios
spring.datasource.username=${DB_USER:postgres}
# A senha de verdade fica em "local.properties" (ao lado do pom.xml), que NAO vai para o Git.
# Veja "local.properties.example". O valor abaixo e so um padrao generico.
spring.datasource.password=${DB_PASSWORD:postgres}
spring.config.import=optional:file:./local.properties

# O schema e criado pelo Flyway (src/main/resources/db/migration); o Hibernate so confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT (troque a chave em producao: variavel de ambiente JWT_SECRET, minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:troque-esta-chave-em-producao-minimo-32-caracteres}
app.jwt.expiracao-minutos=60

# CORS: origens do React em desenvolvimento
app.cors.origens=http://localhost:5173,http://localhost:3000

# Administrador inicial, criado na primeira execucao se nao existir
app.admin.email=${ADMIN_EMAIL:admin@prontuarios.local}
app.admin.nome=Administrador do Sistema
app.admin.senha=${ADMIN_SENHA:Admin@12345}